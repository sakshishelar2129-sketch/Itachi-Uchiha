<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Uchiha Itachi</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>


  <!-- =====================================================
       BACKGROUND MUSIC
       ===================================================== -->

  <audio
    id="bgMusic"
    src="Itachi-audio.mp3"
    preload="auto"
    loop>
  </audio>



  <!-- =====================================================
       LOADING SCREEN
       ===================================================== -->

  <div id="loader">

    <p>
      LOADING
      <span id="loaderPct">0</span>%
    </p>

    <div class="bar">
      <span id="loaderFill"></span>
    </div>

  </div>



  <!-- =====================================================
       ACT 1 — ITACHI SCROLL ANIMATION
       ===================================================== -->

  <section id="scrub">

    <div class="sticky">

      <canvas
        id="mainCanvas">
      </canvas>

    </div>

  </section>



  <!-- =====================================================
       ACT 2 — SHARINGAN EYES
       ===================================================== -->

  <section id="eyes">

    <canvas
      id="eyeCanvas">
    </canvas>

    <div class="eyes-copy">

      <h2>LOOK BACK</h2>

      <p>Move your cursor</p>

    </div>

  </section>



  <!-- =====================================================
       CAPTIONS
       ===================================================== -->

  <div id="captions">


    <!-- ---------------------------------------------------
         OPENING
         --------------------------------------------------- -->

    <div class="phase">

      <h1>静寂</h1>

      <p class="creator">
        BY SAKSHI SHELAR
      </p>

    </div>



    <!-- ---------------------------------------------------
         AWAKENING
         --------------------------------------------------- -->

    <div class="phase">

      <h2>覚醒</h2>

      <p>
        AWAKENING
      </p>

    </div>



    <!-- ---------------------------------------------------
         SHARINGAN
         --------------------------------------------------- -->

    <div class="phase">

      <h2>写輪眼</h2>

      <p>
        SHARINGAN
      </p>

    </div>



    <!-- ---------------------------------------------------
         CROWS
         --------------------------------------------------- -->

    <div class="phase">

      <h2>烏</h2>

      <p>
        A THOUSAND CROWS
      </p>

    </div>

  </div>



  <!-- =====================================================
       EFFECT LAYERS
       ===================================================== -->

  <!-- Amaterasu / black flames -->

  <canvas
    id="flameCanvas"
    aria-hidden="true">
  </canvas>



  <!-- Crows / feathers / lightning -->

  <canvas
    id="featherCanvas"
    aria-hidden="true">
  </canvas>



  <!-- =====================================================
       MUSIC CONTROL
       ===================================================== -->

  <button
    id="soundToggle"
    type="button"
    aria-pressed="false"
    title="Play Itachi music"
  >

    <span class="jp">
      音
    </span>

    <span id="soundState">
      MUSIC OFF
    </span>

  </button>



  <!-- =====================================================
       CUSTOM SHARINGAN CURSOR
       ===================================================== -->

  <div
    id="cursor"
    aria-hidden="true"
  >

    <svg
      viewBox="0 0 100 100"
      xmlns="http://www.w3.org/2000/svg"
    >


      <!-- Outer Sharingan ring -->

      <circle
        cx="50"
        cy="50"
        r="46"
        fill="none"
        stroke="#e01e2f"
        stroke-width="3"
      />



      <!-- Red inner glow -->

      <circle
        cx="50"
        cy="50"
        r="46"
        fill="#7a0510"
        fill-opacity="0.35"
      />



      <!-- Inner black ring -->

      <circle
        cx="50"
        cy="50"
        r="30"
        fill="none"
        stroke="#000000"
        stroke-opacity="0.7"
        stroke-width="2"
      />



      <!-- Tomoe -->

      <g fill="#050505">


        <g id="tomoe">

          <circle
            cx="50"
            cy="29"
            r="7.5"
          />

          <path
            d="
              M42.6 27.5
              C40 36 44 42 52 44
              C47 38 47.5 33 50 29
              Z
            "
          />

        </g>



        <!-- Second tomoe -->

        <use
          href="#tomoe"
          transform="rotate(120 50 50)"
        />



        <!-- Third tomoe -->

        <use
          href="#tomoe"
          transform="rotate(240 50 50)"
        />



        <!-- Center -->

        <circle
          cx="50"
          cy="50"
          r="7"
        />

      </g>

    </svg>

  </div>



  <!-- =====================================================
       CURSOR DOT
       ===================================================== -->

  <div
    id="cursorDot"
    aria-hidden="true">
  </div>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="main.js"></script>


</body>

</html>
