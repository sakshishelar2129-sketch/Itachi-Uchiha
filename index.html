<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uchiha Itachi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <p>LOADING <span id="loaderPct">0</span>%</p>
    <div class="bar"><span id="loaderFill"></span></div>
  </div>

  <!-- ACT 1: scroll animation -->
  <section id="scrub">
    <div class="sticky">
      <canvas id="mainCanvas"></canvas>
    </div>
  </section>

  <!-- ACT 2: eyes follow the mouse -->
  <section id="eyes">
    <canvas id="eyeCanvas"></canvas>
    <div class="eyes-copy"><h2>LOOK BACK</h2><p>Move your cursor</p></div>
  </section>

  <!-- Captions live outside the sticky box so the flames never cover them -->
  <div id="captions">
    <div class="phase"><h1>静寂</h1><p>SILENCE</p></div>
    <div class="phase"><h2>覚醒</h2><p>AWAKENING</p></div>
    <div class="phase"><h2>写輪眼</h2><p>SHARINGAN</p></div>
    <div class="phase"><h2>烏</h2><p>A THOUSAND CROWS</p></div>
  </div>

  <!-- EFFECT LAYERS (fixed, on top of everything, never block clicks) -->
  <canvas id="flameCanvas" aria-hidden="true"></canvas>   <!-- black flame (Amaterasu) -->
  <canvas id="featherCanvas" aria-hidden="true"></canvas> <!-- crow feathers + lightning -->

  <!-- Sound toggle -->
  <button id="soundToggle" type="button" aria-pressed="false" title="Thunder and rain sound">
    <span class="jp">音</span> <span id="soundState">SOUND OFF</span>
  </button>

  <!-- Custom cursor: rotating Sharingan ring + dot -->
  <div id="cursor" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#e01e2f" stroke-width="3"/>
      <circle cx="50" cy="50" r="46" fill="#7a0510" fill-opacity=".35"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#000" stroke-opacity=".7" stroke-width="2"/>
      <g fill="#050505">
        <g id="tomoe">
          <circle cx="50" cy="29" r="7.5"/>
          <path d="M42.6 27.5 C40 36 44 42 52 44 C47 38 47.5 33 50 29 Z"/>
        </g>
        <use href="#tomoe" transform="rotate(120 50 50)"/>
        <use href="#tomoe" transform="rotate(240 50 50)"/>
        <circle cx="50" cy="50" r="7"/>
      </g>
    </svg>
  </div>
  <div id="cursorDot" aria-hidden="true"></div>

  <script src="main.js"></script>
</body>
</html>
